cloud_topic: /doals/lidar_points
odom_topic: /doals/odom
map_frame: map
input_cloud_in_world: false
subscriber_queue_size: 20
sync_queue_size: 50
sync_tolerance: 0.01

resolution: 0.2
min_range: 1.0
max_range: 15.0
prob_hit: 0.70
prob_miss: 0.40
prob_min: 0.12
prob_max: 0.97
occupied_probability: 0.65

# Occupancy criterion switch. false (default) uses the log-odds probability
# above; true builds the map from a truncated signed distance field (TSDF).
# tsdf_truncation: only voxels within +/- this distance of the surface are fused.
# tsdf_surface_band: a voxel is occupied when its fused tsdf <= this value.
# tsdf_max_weight: saturates the fusion weight so surfaces stay adaptive and
# stale/dynamic geometry can be carved away by later free-space rays. This is the
# counterpart of voxblox/Dynablox "max_weight" (default 1000, near-frozen); a
# much smaller value is used here so dynamic surfaces self-heal faster.
use_tsdf: false
tsdf_truncation: 0.60
tsdf_surface_band: 0.3
tsdf_max_weight: 100.0

esdf_max_distance: 2.5
esdf_update_every_n_frames: 1000


# Dynablox-style ever-free dynamic filtering. Names/semantics follow
# ethz-asl/dynablox (EverFreeIntegrator + Clustering).
use_dynablox: true
# Height band used to restrict dynamic detection. By default it is interpreted
# in the SENSOR frame (z relative to the LiDAR); set dynamic_z_use_map_frame to
# true to use the map frame, which is far more robust for flat ground.
dynamic_z_use_map_frame: false
dynamic_z_min: -0.5
dynamic_z_max: 3.0
ever_free_burn_in_period: 5
ever_free_temporal_buffer_frames: 2
ever_free_reset_occupied_frames: 150
ever_free_neighbor_connectivity: 26
# Free margin for the ever-free test (probability mode only). 0 disables it.
# Raise it (e.g. 0.2) when flat surfaces such as shop facades are falsely
# marked dynamic: only voxels clearly in free space may then become ever-free.
ever_free_max_free_probability: 0.0

cluster_connectivity: 6
cluster_grow_clusters_twice: false
cluster_min_separation: 0.2
cluster_min_extent: 0.2  
cluster_max_extent: 100.0
cluster_min_points: 20
cluster_max_points: 200000

# Dynamic object tracking + velocity prediction. Published on ~dynamic_objects
# as a MarkerArray (bounding box, id/speed label, velocity arrow, predicted
# position sphere).


use_tracking: true
track_max_association_distance: 1.0
track_min_track_duration: 2
track_max_misses: 5
# Kalman filter noise (constant-velocity model): unmodelled acceleration and
# measured centroid position standard deviations. Larger process noise trusts
# measurements more; larger measurement noise trusts the motion model more.

track_kalman_process_noise: 2.0
track_kalman_measurement_noise: 0.5
track_velocity_horizon: 1.0
track_max_velocity: 20.0
track_min_velocity: 0.1
track_max_tracks: 500
track_publish_unconfirmed: false


sensor_extrinsic_translation: [0.0, 0.0, 0.0]
sensor_extrinsic_rpy: [0.0, 0.0, 0.0]
publish_every_n_frames: 20
publish_known_voxels: true
publish_2d_grid: true
grid_z_min: -1.5
grid_z_max: 2.0
grid_max_cells: 4000000
